[workspace]
resolver = "2"
members = ["rv-core", "rv"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v7"] }
jiff = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
