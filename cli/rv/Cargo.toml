[package]
name = "rv"
version = "0.1.0"
edition = "2021"
description = "Git-native local code review plumbing"

[dependencies]
rv-core = { path = "../rv-core" }
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
